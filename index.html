<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Arshhi – Door to door beauty care</title><meta name="description" content="Arshhi brings beauty care services to your home in Kolkata, West Bengal."><style id="css">:root{--bg:#fff;--blush:#fbefec;--ink:#3b2a20;--soft:#6e5b4e;--bronze:#9a6a36;--rose:#e3a0a0;--line:#ecdcd3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1613;--blush:#271d19;--ink:#f5e9e1;--soft:#cdb9ab;--bronze:#d3a26b;--line:#3d2f28}}
:root[data-theme="dark"]{--bg:#1d1613;--blush:#271d19;--ink:#f5e9e1;--soft:#cdb9ab;--bronze:#d3a26b;--line:#3d2f28}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
h1,h2,h3{font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:700;line-height:1.2;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--bronze);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
section{padding:72px 0}
h2{font-size:clamp(32px,6vw,42px);margin-bottom:14px}
h2::after{content:"";display:block;width:56px;height:3px;background:var(--rose);margin-top:12px;border-radius:2px}
.lead{color:var(--soft);max-width:56ch;margin:0 0 40px}

.hero{background:linear-gradient(135deg,var(--blush) 0%,var(--bg) 100%);padding:40px 0 56px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center}
.plate{display:inline-block;background:#fff;border-radius:28px;padding:10px;max-width:100%}
.plate img{display:block;width:min(340px,76vw);height:auto}
.hero h1{font-size:clamp(34px,5vw,54px);margin:0 0 16px;max-width:16ch}
.hero p{margin:0 0 28px;max-width:46ch;color:var(--soft)}
.hero .btns{justify-content:flex-start}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:500;border:2px solid var(--bronze);min-height:48px}
.btn.main{background:var(--bronze);color:#fff}
.btn.alt{color:var(--bronze)}
.btn:hover{filter:brightness(1.08)}

.services ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.services ul{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.services li{display:flex;flex-direction:column;gap:6px;padding:22px 0;border-bottom:1px solid var(--line)}
.services h3{font-size:24px;color:var(--bronze)}
.services p{margin:0;color:var(--soft)}
@media(max-width:700px){.services ul{grid-template-columns:1fr}}

.how{background:var(--blush)}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.how li{counter-increment:s;padding-top:16px;border-top:3px solid var(--rose)}
.how li::before{content:"Step " counter(s);display:block;color:var(--bronze);font-weight:500;margin-bottom:4px}
.how h3{font-size:23px;margin-bottom:6px}
.how p{margin:0;color:var(--soft)}

.contact dl{margin:0 0 32px;background:var(--blush);border:1px solid var(--line);border-radius:14px;padding:28px 30px;display:grid;grid-template-columns:max-content 1fr;gap:14px 28px}
.contact dt{color:var(--soft)}
.contact dd{margin:0;font-weight:500}
.contact a.tel{font-size:28px;font-weight:700;color:var(--bronze);text-decoration:none}
@media(max-width:560px){.contact dl{grid-template-columns:1fr;gap:2px}.contact dd{margin-bottom:14px}}

footer{background:var(--blush);border-top:1px solid var(--line);padding:48px 0 96px;color:var(--soft);font-size:16px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:32px}
.fgrid h4{margin:0 0 10px;font-size:18px;color:var(--ink)}
.fgrid a{display:block;text-decoration:none;margin-bottom:6px}
.fgrid a:hover{color:var(--bronze)}
.fgrid p{margin:0}
.fbrand{font-size:28px;font-weight:700;color:var(--bronze);margin-bottom:8px}
.copy{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:700px){.fgrid{grid-template-columns:1fr}}
.topbar{background:var(--bronze);color:#fff;font-size:14px}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}
.topbar a{text-decoration:none;font-weight:500}
.dock{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.dock .btn{flex:1;text-align:center;padding:12px 10px}
@media(max-width:700px){.dock{display:flex}}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{font-size:26px;font-weight:700;color:var(--bronze);text-decoration:none;letter-spacing:.5px}
.nav ul{display:flex;align-items:center;gap:26px;list-style:none;margin:0;padding:0}
.nav li a{text-decoration:none;font-weight:500;padding:8px 2px;border-bottom:2px solid transparent}
.nav li a:hover{border-color:var(--rose)}
.nav .btn{padding:8px 20px;min-height:40px;color:#fff;font-size:16px}
.facts{background:var(--bg);border-bottom:1px solid var(--line)}
.facts .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 24px;padding-top:18px;padding-bottom:18px;text-align:center;color:var(--soft);font-size:16px}
.facts b{color:var(--ink);font-weight:700}
@media(max-width:700px){.nav .wrap{height:56px}.brand{font-size:23px}.nav ul{gap:14px;font-size:15px}.nav li.cta{display:none}.facts .wrap{text-align:left}}
@media(max-width:380px){.nav ul{gap:10px;font-size:14px}}

.svc{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:10px}
.svc::after{content:"+";display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--bronze);border-radius:50%;font-size:18px;line-height:1;font-weight:500}
.svc:hover{text-decoration:underline;text-decoration-color:var(--rose);text-underline-offset:5px}
.modal{border:0;border-radius:18px;padding:30px 28px 26px;width:min(520px,calc(100% - 32px));background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal::backdrop{background:rgba(40,25,18,.55)}
.modal h3{font-size:32px;color:var(--bronze);margin-bottom:8px;padding-right:40px}
.modal p{margin:0 0 16px;color:var(--soft)}
.modal h4{margin:0 0 6px;font-size:18px}
.modal ul{margin:0 0 18px;padding-left:20px}
.modal li{margin-bottom:4px}
.modal .note{font-size:15px;border-top:1px solid var(--line);padding-top:14px}
.modal .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--blush);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.modal .btns{justify-content:flex-start}
body.lock{overflow:hidden}

@keyframes slideIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
.hero-text>*{animation:slideIn .9s cubic-bezier(.2,.7,.2,1) both}
.hero-text>p{animation-delay:.25s}
.hero-text>.btns{animation-delay:.5s}
@media(max-width:800px){.hero-grid{grid-template-columns:1fr;gap:24px;justify-items:start}.plate img{width:min(240px,64vw)}.hero-text>*{animation-name:slideUp}@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}}
@media(prefers-reduced-motion:reduce){.hero-text>*{animation:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.aopen{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.aopen[hidden]{display:none}
@media(max-width:700px){.aopen{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
#adm{width:min(760px,calc(100% - 24px));max-height:92vh;overflow:auto}
#adm fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 18px;padding:14px 16px}
#adm legend{font-weight:700;color:var(--bronze);padding:0 6px;font-size:18px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:15px;color:var(--soft);margin-bottom:4px}
.f input,.f textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.item{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.sm{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--blush);color:var(--ink);border-radius:8px;padding:8px 14px}
.abar{position:sticky;bottom:-26px;background:var(--bg);padding:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.logoprev{max-width:160px;display:block;margin-bottom:8px;background:#fff;border-radius:10px;padding:6px}

.fbtn{margin-top:14px;background:none;border:0;padding:0;font:inherit;font-weight:500;color:var(--bronze);text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:44px;display:block}
.hero .reviews{margin-top:40px}
.rh{font-weight:700;font-size:22px;margin:0 0 16px}
.rgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.rc{background:var(--bg);border-left:3px solid var(--rose);padding:14px 18px;border-radius:0 10px 10px 0}
.stars{color:var(--bronze);letter-spacing:2px;font-size:18px}
.rc p{margin:6px 0 8px;color:var(--ink)}
.rc b{color:var(--soft);font-weight:500;font-size:15px}
.rate{display:flex;gap:6px;margin:0 0 14px}
.rate button{font-size:32px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:var(--bronze)}
#fbMsg{display:block;margin-top:10px;color:var(--soft);font-size:15px}

<dialog class="modal" id="fbModal" aria-labelledby="fbT"><button type="button" class="x" id="fbClose" aria-label="Close">&times;</button><h3 id="fbT">Share your feedback</h3><p>Tell us about your visit. Your message opens in WhatsApp and reaches us when you press send.</p><div class="rate" role="group" aria-label="Rating"><button type="button" aria-label="1 star" aria-pressed="false">★</button><button type="button" aria-label="2 stars" aria-pressed="false">★</button><button type="button" aria-label="3 stars" aria-pressed="false">★</button><button type="button" aria-label="4 stars" aria-pressed="false">★</button><button type="button" aria-label="5 stars" aria-pressed="false">★</button></div><label class="f"><span>Your name (optional)</span><input id="fbName" type="text" autocomplete="name"></label><label class="f"><span>Your feedback</span><textarea id="fbText" rows="4"></textarea></label><a class="btn main" id="fbSend" href="#" target="_blank" rel="noopener">Send on WhatsApp</a><span id="fbMsg" role="status"></span></dialog>
`}

var m,last,fb,rate=0, stars;
root.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.svc');if(!b)return;var s=data.services[+b.dataset.i];last=b;
$('mTitle').textContent=s.n;$('mDesc').textContent=s.d;var L=$('mList');L.innerHTML='';s.l.forEach(function(x){var li=document.createElement('li');li.textContent=x;L.appendChild(li)});
$('mWa').href='https://wa.me/'+dg(data.phone)+'?text='+encodeURIComponent('Hello '+data.brand+', I would like to book: '+s.n);
m.showModal();document.body.classList.add('lock')});
function wire(){m=$('svcModal');
$('mClose').addEventListener('click',function(){m.close()});
m.addEventListener('click',function(e){if(e.target===m)m.close()});
m.addEventListener('close',function(){document.body.classList.remove('lock');if(last)last.focus()});

fb=$('fbModal');rate=0;stars=fb.querySelectorAll('.rate button');
$('fbOpen').addEventListener('click',function(){fb.showModal();document.body.classList.add('lock')});
stars.forEach(function(s,i){s.addEventListener('click',function(){rate=i+1;stars.forEach(function(t,j){t.classList.toggle('on',j<rate);t.setAttribute('aria-pressed',j<rate?'true':'false')})})});
$('fbClose').addEventListener('click',function(){fb.close()});
fb.addEventListener('click',function(e){if(e.target===fb)fb.close()});
fb.addEventListener('close',function(){document.body.classList.remove('lock')});
$('fbSend').addEventListener('click',function(e){var a=$('fbSend'),msg=$('fbMsg');
if(!rate){e.preventDefault();msg.textContent='Please choose a star rating first.';return}
var n=$('fbName').value.trim(),c=$('fbText').value.trim();
a.href='https://wa.me/'+dg(data.phone)+'?text='+encodeURIComponent('Feedback for '+data.brand+'\nRating: '+rate+'/5'+(n?'\nName: '+n:'')+(c?'\nComment: '+c:''));
msg.textContent='WhatsApp will open. Press send there to deliver your feedback.'});
}

function paint(){root.innerHTML=render(data);wire()}
paint();
fetch('/api/content',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(nd){if(nd&&nd.brand&&Array.isArray(nd.services)&&JSON.stringify(nd)!==JSON.stringify(data)){nd.reviews=nd.reviews||[];data=nd;paint()}}).catch(function(){});
if(cfg&&cfg.projectId&&cfg.apiKey&&!/^PASTE/.test(cfg.projectId+cfg.apiKey)){fetch('https://firestore.googleapis.com/v1/projects/'+cfg.projectId+'/databases/(default)/documents/site/content?key='+cfg.apiKey,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.fields&&j.fields.json){var nd=JSON.parse(j.fields.json.stringValue);if(JSON.stringify(nd)!==JSON.stringify(data)){data=nd;paint()}}}).catch(function(){})}
})();
</script>
